services:
  - type: web
    name: yiti-ai-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: YITI_MODE
        value: offline
      - key: YITI_LOCAL_INDEX
        value: /var/data/search.sqlite3
      - key: YITI_SEMANTIC_INDEX
        value: /var/data/policy-vectors.npz
      - key: YITI_ANSWER_MODE
        value: gemini
      - key: YITI_GEMINI_ENABLED
        value: "true"
      - key: YITI_GEMINI_GROUNDED_ANSWERS_ENABLED
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false